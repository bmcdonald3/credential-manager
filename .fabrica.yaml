project:
    name: credential-manager
    module: github.com/openchami/credential-manager
    created: 2026-05-31T13:43:47.713635-07:00
features:
    validation:
        enabled: true
        mode: strict
    events:
        enabled: true
        bus_type: memory
    conditional:
        enabled: true
        etag_algorithm: sha256
    auth:
        enabled: false
    storage:
        enabled: true
        type: ent
        db_driver: sqlite3
    reconciliation:
        enabled: true
        worker_count: 5
        requeue_delay: 5
generation:
    handlers: true
    storage: true
    client: true
    openapi: true
    events: true
    middleware: true
    reconciliation: true
